<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trippone">
<meta name="theme-color" content="#171a30">
<title>Trippone</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{
  --sand:#f3ead9; --cream:#faf6ec; --ink:#2c2015; --terra:#c05a2b;
  --majorelle:#4a52c9; --palm:#3e6b4f; --night:#171a30; --gold:#d9a441;
  --carta:#ffffff; --bordo:rgba(44,32,21,.12); --muto:rgba(44,32,21,.55);
  --serif:ui-serif, Georgia, "Times New Roman", serif;
  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --sand:#171a30; --cream:#10122a; --ink:#efe7d8; --carta:#232649;
    --bordo:rgba(239,231,216,.14); --muto:rgba(239,231,216,.55);
    --terra:#e07a48; --gold:#e2b45e; --palm:#6da583;
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:var(--sans); background:var(--sand); color:var(--ink);
  min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
.schermo{display:none; min-height:100vh}
.schermo.attivo{display:block}
.eyebrow{font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--terra); font-weight:700}
h1,h2,.display{font-family:var(--serif)}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
a{color:var(--majorelle)}

/* ---------- sblocco ---------- */
#sblocco{display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:32px; background:var(--night); color:#efe7d8; text-align:center}
#sblocco .logo{font-family:var(--serif); font-size:3rem; color:#e2b45e; margin-bottom:4px}
#sblocco .sotto{opacity:.7; margin-bottom:40px; font-size:.95rem}
#sblocco input{
  width:100%; max-width:340px; padding:16px; font-size:1.1rem; text-align:center;
  border-radius:14px; border:1px solid rgba(239,231,216,.25);
  background:rgba(239,231,216,.08); color:#efe7d8; outline:none;
}
#sblocco input:focus{border-color:#e2b45e}
#sblocco .entra{
  margin-top:16px; width:100%; max-width:340px; padding:16px; border-radius:14px;
  background:#c05a2b; color:#fff; font-size:1.05rem; font-weight:600;
}
#sblocco .errore{color:#ff9f7a; margin-top:14px; min-height:1.4em; font-size:.92rem}
#sblocco .stato{opacity:.5; margin-top:26px; font-size:.8rem}

/* ---------- home ---------- */
.testata{
  padding:calc(env(safe-area-inset-top) + 18px) 20px 18px;
  background:var(--night); color:#efe7d8;
}
.testata .logo{font-family:var(--serif); font-size:1.6rem; color:#e2b45e}
.contenuto{padding:20px; max-width:640px; margin:0 auto}
.countdown{
  background:linear-gradient(135deg, var(--terra), #a34620); color:#fff;
  border-radius:20px; padding:24px; margin-bottom:20px;
}
.countdown .grande{font-family:var(--serif); font-size:2.6rem; line-height:1.1}
.countdown .picc{opacity:.85; margin-top:6px; font-size:.95rem}
.card-viaggio{
  display:block; width:100%; text-align:left; background:var(--carta);
  border:1px solid var(--bordo); border-radius:20px; padding:20px; margin-bottom:14px;
}
.card-viaggio h2{font-size:1.5rem}
.card-viaggio .date{color:var(--muto); margin-top:4px; font-size:.92rem}
.card-viaggio .sub{color:var(--terra); font-family:var(--serif); font-style:italic}
h3.sezione{margin:26px 0 10px; font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muto)}
.footerino{margin-top:36px; text-align:center; color:var(--muto); font-size:.8rem}
.footerino button{color:var(--majorelle); font-size:.8rem; padding:8px}

/* ---------- viaggio ---------- */
.testata-v{
  position:sticky; top:0; z-index:600; background:var(--night); color:#efe7d8;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 0;
}
.testata-v .riga{display:flex; align-items:center; gap:8px; padding-bottom:10px}
.testata-v .indietro{padding:10px; display:flex; color:#e2b45e}
.testata-v h1{font-size:1.25rem}
#sezione-corrente{flex:1; text-align:right; padding-right:6px; font-size:.78rem;
  letter-spacing:.14em; text-transform:uppercase; color:rgba(239,231,216,.5)}
/* barra sezioni fissa in basso: tutte e sei visibili insieme */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:700;
  display:flex; background:var(--night);
  border-top:1px solid rgba(239,231,216,.12);
  padding:6px 2px calc(env(safe-area-inset-bottom) + 4px);
}
.tab{
  flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 2px; color:rgba(239,231,216,.55); font-size:.6rem; font-weight:600;
  letter-spacing:.01em; position:relative;
}
.tab.attivo{color:#e2b45e}
.tab svg{width:21px; height:21px}
.tab .etic{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.tab .badge{
  position:absolute; top:2px; right:calc(50% - 20px); min-width:16px; height:16px;
  border-radius:99px; background:var(--terra); color:#fff; font-size:.58rem;
  display:flex; align-items:center; justify-content:center; padding:0 4px; line-height:1;
}
.pannello{display:none; padding:18px 16px calc(env(safe-area-inset-bottom) + 96px); max-width:640px; margin:0 auto}
.pannello.attivo{display:block}

/* itinerario */
.giorno{background:var(--carta); border:1px solid var(--bordo); border-radius:16px; margin-bottom:10px; overflow:hidden}
.giorno summary{list-style:none; display:flex; gap:12px; align-items:center; padding:14px 16px; cursor:pointer}
.giorno summary::-webkit-details-marker{display:none}
.giorno .dnum{
  flex:0 0 auto; width:44px; height:44px; border-radius:12px; background:var(--sand);
  display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1;
}
.giorno.oggi .dnum{background:var(--terra); color:#fff}
.giorno .dnum b{font-size:1.15rem}
.giorno .dnum span{font-size:.6rem; text-transform:uppercase; letter-spacing:.05em; margin-top:2px}
.giorno .dtit{flex:1; min-width:0}
.giorno .dtit b{display:block; font-size:.98rem}
.giorno .dtit small{color:var(--muto)}
.giorno .freccia{transition:transform .2s; color:var(--muto)}
.giorno[open] .freccia{transform:rotate(180deg)}
.giorno .corpo{padding:0 16px 16px; font-size:.95rem; line-height:1.55}
.giorno .corpo p{margin-bottom:10px}
.etichetta{font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--terra); font-weight:700; margin:12px 0 6px}
.giorno ul{padding-left:18px; margin-bottom:10px}
.giorno li{margin-bottom:4px}
.bott{
  display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:12px;
  background:var(--majorelle); color:#fff; font-weight:600; font-size:.9rem; text-decoration:none;
}
.bott.secondario{background:var(--sand); color:var(--ink); border:1px solid var(--bordo)}
.bott svg{width:17px; height:17px; flex:0 0 auto}
.notte-chip{display:inline-flex; align-items:center; gap:6px; background:var(--sand);
  border-radius:99px; padding:5px 12px; font-size:.82rem; margin-top:8px}
.notte-chip svg{width:13px;height:13px; color:var(--gold)}

/* mappa */
#mappa-vera{height:62vh; border-radius:16px; border:1px solid var(--bordo); background:var(--carta)}
#mappa-svg{display:none}
#mappa-svg svg{width:100%; height:auto; border-radius:16px; border:1px solid var(--bordo); background:var(--cream)}
.avviso-offline{background:var(--carta); border:1px solid var(--bordo); border-radius:12px;
  padding:10px 14px; font-size:.85rem; color:var(--muto); margin-bottom:10px; display:none}
.legenda-tappe{margin-top:14px}
.legenda-tappe .voce{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--bordo); font-size:.92rem}
.legenda-tappe .voce:last-child{border-bottom:0}
.legenda-tappe .pallino{flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--terra);
  color:#fff; display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700}
.legenda-tappe .poi .pallino{background:var(--palm); width:20px; height:20px; font-size:.62rem}
.legenda-tappe a{margin-left:auto; flex:0 0 auto; color:var(--majorelle); display:flex; padding:6px}

/* documenti */
.cat-doc{margin-bottom:8px}
.doc{
  background:var(--carta); border:1px solid var(--bordo);
  border-radius:14px; margin-bottom:8px; display:flex; align-items:stretch;
}
.doc .doc-apri{flex:1; min-width:0; display:flex; gap:12px; align-items:center; padding:14px 0 14px 16px; text-align:left}
.doc .icona{flex:0 0 auto; width:38px; height:38px; border-radius:10px; background:var(--sand);
  display:flex; align-items:center; justify-content:center; color:var(--terra)}
.doc .icona svg{width:19px; height:19px}
.doc .info{flex:1; min-width:0}
.doc .info b{display:block; font-size:.93rem; overflow-wrap:anywhere}
.doc .info .cod{font-family:ui-monospace, Menlo, monospace; font-size:.82rem; color:var(--terra); font-weight:700; overflow-wrap:anywhere}
.doc .btn-elimina{padding:0 14px}
.doc .apri{color:var(--muto); padding-right:12px; display:flex; align-items:center}

/* chip filtri categorie */
.chips-cat{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; margin-bottom:4px; scrollbar-width:none}
.chips-cat::-webkit-scrollbar{display:none}
.chip-cat{
  flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:8px 13px;
  border:1px solid var(--bordo); border-radius:99px; background:var(--carta);
  font-size:.82rem; font-weight:600; color:var(--muto);
}
.chip-cat svg{width:15px; height:15px}
.chip-cat.attivo{background:var(--terra); color:#fff; border-color:var(--terra)}
.form-inline select{
  width:100%; padding:12px; margin-bottom:8px; border:1px solid var(--bordo); border-radius:10px;
  background:var(--cream); color:var(--ink); font:inherit; font-size:.95rem; -webkit-appearance:none;
}

/* consigli */
.tema{background:var(--carta); border:1px solid var(--bordo); border-radius:16px; margin-bottom:10px; overflow:hidden}
.tema summary{list-style:none; display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer; font-weight:600}
.tema summary::-webkit-details-marker{display:none}
.tema ul{padding:0 16px 14px 34px; font-size:.93rem; line-height:1.5}
.tema li{margin-bottom:8px}

/* checklist */
.check{
  display:flex; gap:12px; align-items:flex-start; background:var(--carta);
  border:1px solid var(--bordo); border-radius:14px; padding:13px 15px; margin-bottom:8px;
}
.check input{width:22px; height:22px; margin-top:1px; accent-color:var(--palm); flex:0 0 auto}
.check.fatta label{text-decoration:line-through; color:var(--muto)}
.check label{flex:1; font-size:.93rem; line-height:1.4}
.check .entro{display:block; font-size:.78rem; color:var(--terra); margin-top:3px}
.check.ritardo{border-color:var(--terra)}
.check.ritardo .entro{font-weight:700}
.check.fatta .entro{color:var(--muto); font-weight:400}
.progresso{font-size:.9rem; color:var(--muto); margin-bottom:14px}
.barra-prog{height:6px; border-radius:99px; background:var(--bordo); margin-top:8px; overflow:hidden}
.barra-prog i{display:block; height:100%; background:var(--palm); border-radius:99px; transition:width .3s}

/* contatti */
.contatto{display:flex; align-items:center; gap:12px; background:var(--carta);
  border:1px solid var(--bordo); border-radius:14px; padding:13px 15px; margin-bottom:8px}
.contatto .info{flex:1; min-width:0}
.contatto .info b{display:block; font-size:.93rem}
.contatto .info small{color:var(--muto)}
.contatto .chiama{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  width:44px; height:44px; border-radius:50%; background:var(--palm); color:#fff; text-decoration:none;
}
.contatto .chiama svg{width:19px;height:19px}

/* visore documento */
#visore{position:fixed; inset:0; z-index:900; background:var(--night); display:none; flex-direction:column}
#visore.aperto{display:flex}
#visore .barra{display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top) + 8px) 12px 8px; color:#efe7d8}
#visore .barra b{flex:1; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#visore .barra button{padding:10px; color:#e2b45e; display:flex}
#visore .corpo{flex:1; background:#333; overflow:auto; -webkit-overflow-scrolling:touch; padding-bottom:env(safe-area-inset-bottom)}
#visore canvas{display:block; width:100%; margin:0 auto 6px; background:#fff}
#visore img{max-width:100%; display:block; margin:0 auto}
.stato-pdf{padding:26px; text-align:center; color:#aaa; font-size:.9rem}

/* bottone aggiungi + form inline */
.btn-aggiungi{
  width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  padding:13px; border:1.5px dashed var(--bordo); border-radius:14px; color:var(--majorelle);
  font-weight:600; font-size:.92rem; margin-bottom:10px; background:none;
}
.form-inline{background:var(--carta); border:1px solid var(--bordo); border-radius:14px;
  padding:14px; margin-bottom:10px; display:none}
.form-inline.aperto{display:block}
.form-inline input[type=text], .form-inline input[type=url], .form-inline input[type=tel], .form-inline input[type=date]{
  width:100%; padding:12px; margin-bottom:8px; border:1px solid var(--bordo); border-radius:10px;
  background:var(--cream); color:var(--ink); font:inherit; font-size:.95rem;
}
.form-inline .riga-bott{display:flex; gap:8px}
.form-inline .riga-bott button{flex:1; padding:12px; border-radius:10px; font-weight:600; font-size:.92rem}
.form-inline .ok{background:var(--palm); color:#fff}
.form-inline .annulla{background:var(--sand); color:var(--ink); border:1px solid var(--bordo)}
.mio-tag{display:inline-block; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase;
  background:var(--majorelle); color:#fff; border-radius:4px; padding:2px 6px; margin-left:6px; vertical-align:middle}
.btn-elimina{flex:0 0 auto; padding:8px; color:var(--muto); display:flex; align-self:center}
.nota-sezione{font-size:.82rem; color:var(--muto); line-height:1.45; margin-bottom:12px}

/* segmented control checklist */
.segmenti{display:flex; background:var(--carta); border:1px solid var(--bordo); border-radius:12px;
  padding:3px; margin-bottom:14px}
.segmenti button{flex:1; padding:9px; border-radius:9px; font-weight:600; font-size:.9rem; color:var(--muto)}
.segmenti button.attivo{background:var(--terra); color:#fff}

/* legenda mappa */
.legenda-colori{display:flex; gap:14px; margin-bottom:10px; font-size:.82rem; color:var(--muto)}
.legenda-colori span{display:flex; align-items:center; gap:6px}
.legenda-colori i{width:13px; height:13px; border-radius:50%; display:inline-block}

/* note personali sui giorni */
.nota-giorno{
  background:var(--sand); border-left:3px solid var(--gold); border-radius:0 10px 10px 0;
  padding:10px 12px; margin:12px 0 4px; font-size:.92rem; line-height:1.5; white-space:pre-wrap;
}
.nota-giorno .eyebrow{display:block; margin-bottom:4px}
.btn-nota{color:var(--majorelle); font-weight:600; font-size:.88rem; padding:8px 0; display:inline-flex; align-items:center; gap:6px}
.form-nota textarea{
  width:100%; min-height:90px; padding:12px; border:1px solid var(--bordo); border-radius:10px;
  background:var(--cream); color:var(--ink); font:inherit; font-size:.93rem; resize:vertical; margin:8px 0;
}

/* documenti in evidenza */
.btn-stella{flex:0 0 auto; padding:0 4px 0 10px; color:var(--muto); display:flex; align-items:center}
.btn-stella.attiva{color:var(--gold)}
.btn-stella.attiva svg{fill:currentColor}

/* salvati */
.salvato{display:flex; gap:12px; align-items:center; background:var(--carta);
  border:1px solid var(--bordo); border-radius:14px; padding:13px 15px; margin-bottom:8px}
.salvato .piattaforma{
  flex:0 0 auto; width:38px; height:38px; border-radius:10px; display:flex; align-items:center;
  justify-content:center; font-size:.6rem; font-weight:800; color:#fff; letter-spacing:.02em;
}
.salvato .info{flex:1; min-width:0}
.salvato .info a{display:block; font-size:.93rem; font-weight:600; color:var(--ink);
  text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.salvato .info small{color:var(--muto); font-size:.78rem}
.toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%);
  background:var(--night); color:#efe7d8; padding:12px 20px; border-radius:99px; font-size:.88rem;
  z-index:950; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap;
}
.toast.visibile{opacity:1}
</style>
</head>
<body>

<!-- SBLOCCO -->
<div id="scherm-sblocco" class="schermo attivo">
  <div id="sblocco">
    <div class="logo">Trippone</div>
    <div class="sotto">I viaggi di Paolo, sempre in tasca</div>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" enterkeyhint="go">
    <button class="entra" id="btn-sblocca">Entra</button>
    <div class="errore" id="err-sblocco"></div>
    <div class="stato" id="stato-sblocco"></div>
  </div>
</div>

<!-- HOME -->
<div id="scherm-home" class="schermo">
  <div class="testata"><div class="logo">Trippone</div></div>
  <div class="contenuto">
    <div id="countdown" class="countdown" style="display:none"></div>
    <h3 class="sezione">Prossimi viaggi</h3>
    <div id="lista-prossimi"></div>
    <div id="blocco-passati" style="display:none">
      <h3 class="sezione">Viaggi passati</h3>
      <div id="lista-passati"></div>
    </div>
    <div class="footerino">
      <span id="info-versione"></span> · <span id="stato-offline"></span><br>
      <button id="btn-scarica-offline">Prepara tutto per l'offline</button> ·
      <button id="btn-esci">Esci</button>
    </div>
  </div>
</div>

<!-- VIAGGIO -->
<div id="scherm-viaggio" class="schermo">
  <div class="testata-v">
    <div class="riga">
      <button class="indietro" id="btn-home" aria-label="Indietro">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="titolo-viaggio"></h1>
      <span id="sezione-corrente"></span>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="pann-itinerario" class="pannello"></div>
  <div id="pann-mappa" class="pannello">
    <div class="avviso-offline" id="avviso-mappa">Sei offline: mappa schematica. Con la rete torna quella zoomabile.</div>
    <div class="legenda-colori">
      <span><i style="background:#c05a2b"></i>tappe del percorso</span>
      <span><i style="background:#3e6b4f"></i>deviazioni consigliate</span>
    </div>
    <div id="mappa-vera"></div>
    <div id="mappa-svg"></div>
    <div class="legenda-tappe" id="legenda-tappe"></div>
  </div>
  <div id="pann-documenti" class="pannello"></div>
  <div id="pann-consigli" class="pannello"></div>
  <div id="pann-checklist" class="pannello"></div>
  <div id="pann-contatti" class="pannello"></div>
  <div id="pann-salvati" class="pannello"></div>
</div>

<!-- VISORE DOCUMENTO -->
<div id="visore">
  <div class="barra">
    <button id="visore-chiudi" aria-label="Chiudi">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <b id="visore-titolo"></b>
    <button id="visore-condividi" aria-label="Condividi">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 21h14"/></svg>
    </button>
  </div>
  <div class="corpo" id="visore-corpo"></div>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/pdf.min.js"></script>
<input type="file" id="file-doc" accept="application/pdf,image/*" style="display:none">
<script>
"use strict";

/* ============ cifratura ============ */
const ITERAZIONI = 300000;
let CHIAVE = null;      // CryptoKey AES-GCM
let DB = null;          // bundle decifrato
const cacheDoc = new Map();

async function derivaChiave(password, salt){
  const mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:ITERAZIONI, hash:"SHA-256"},
    mat, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
}
async function decifra(chiave, buf){
  const b = new Uint8Array(buf);
  return crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(16,28)}, chiave, b.slice(28));
}
async function scaricaEnc(percorso){
  const r = await fetch(percorso);
  if(!r.ok) throw new Error("fetch " + percorso + ": " + r.status);
  return r.arrayBuffer();
}
function saltHex(buf){ return Array.from(new Uint8Array(buf).slice(0,16)).map(b => b.toString(16).padStart(2,"0")).join(""); }

async function provaSblocco(password){
  const buf = await scaricaEnc("dati.enc");
  const salt = new Uint8Array(buf).slice(0,16);
  const chiave = await derivaChiave(password, salt);
  const chiaro = await decifra(chiave, buf); // lancia se password sbagliata
  const grezzo = await crypto.subtle.exportKey("raw", chiave);
  localStorage.setItem("trippone-chiave", btoa(String.fromCharCode(...new Uint8Array(grezzo))));
  localStorage.setItem("trippone-salt", saltHex(buf));
  CHIAVE = chiave;
  return JSON.parse(new TextDecoder().decode(chiaro));
}
async function sbloccoAutomatico(){
  const b64 = localStorage.getItem("trippone-chiave");
  if(!b64) return null;
  try{
    const buf = await scaricaEnc("dati.enc");
    const grezzo = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const chiave = await crypto.subtle.importKey("raw", grezzo, {name:"AES-GCM"}, true, ["encrypt","decrypt"]);
    const chiaro = await decifra(chiave, buf);
    CHIAVE = chiave;
    return JSON.parse(new TextDecoder().decode(chiaro));
  }catch(e){
    // chiave vecchia (password o salt cambiati) oppure offline senza cache
    return null;
  }
}

// Voci di testo (checklist, valigia, contatti, salvati) in localStorage;
// i documenti caricati (blob) in IndexedDB.
function extra(){
  const base = {checklist:[], valigia:[], contatti:[], salvati:[], consigli:[], nascosti:{}, note:{}, preferiti:[]};
  try{
    const e = Object.assign({}, base, JSON.parse(localStorage.getItem("trippone-extra-" + VIAGGIO.id) || "{}"));
    e.nascosti = e.nascosti || {}; e.note = e.note || {}; e.preferiti = e.preferiti || []; e.consigli = e.consigli || [];
    return e;
  }
  catch(e){ return base; }
}
/* elementi del viaggio "eliminati" da Paolo: si nascondono, non si toccano i dati */
function nascosto(sezione, id){ return (extra().nascosti[sezione] || []).includes(id); }
function nascondi(sezione, id){
  const e = extra();
  e.nascosti[sezione] = (e.nascosti[sezione] || []).concat(id);
  salvaExtra(e);
}
function ripristina(sezione){
  const e = extra();
  delete e.nascosti[sezione];
  salvaExtra(e);
}
function rigaRipristino(sezione, quanti, dopo){
  if(!quanti) return "";
  return '<p class="nota-sezione" style="text-align:center"><button data-ripristina="' + sezione + '" style="color:var(--majorelle);font-weight:600">' +
    quanti + (quanti === 1 ? " elemento eliminato: ripristina" : " elementi eliminati: ripristinali") + '</button></p>';
}
function attivaRipristino(pannello, rirender){
  document.querySelectorAll(pannello + " [data-ripristina]").forEach(b => b.onclick = () => {
    ripristina(b.dataset.ripristina); rirender();
  });
}
function salvaExtra(e){ localStorage.setItem("trippone-extra-" + VIAGGIO.id, JSON.stringify(e)); }
function nuovoId(){ return "u" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

let _idb = null;
function apriIdb(){
  return new Promise((ok, ko) => {
    if(_idb) return ok(_idb);
    const r = indexedDB.open("trippone", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("docs", {keyPath:"id"});
    r.onsuccess = () => { _idb = r.result; ok(_idb); };
    r.onerror = () => ko(r.error);
  });
}
async function idbDocs(modo, fn){
  const d = await apriIdb();
  return new Promise((ok, ko) => {
    const t = d.transaction("docs", modo);
    const rich = fn(t.objectStore("docs"));
    t.oncomplete = () => ok(rich && rich.result);
    t.onerror = () => ko(t.error);
  });
}

/* form inline riutilizzabile */
function formInline(campi, onOk){
  const id = "f" + Math.random().toString(36).slice(2,7);
  const html = '<div class="form-inline" id="' + id + '">' +
    campi.map(c => {
      if(c.tipo === "select")
        return '<select data-campo="' + c.nome + '">' +
          c.opzioni.map(o => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join("") + '</select>';
      return '<input type="' + c.tipo + '" placeholder="' + esc(c.ph) + '" data-campo="' + c.nome + '"' + (c.opz ? "" : " required") + '>';
    }).join("") +
    '<div class="riga-bott"><button class="annulla">Annulla</button><button class="ok">Salva</button></div></div>';
  return { html,
    attiva(){
      const f = document.getElementById(id);
      f.previousElementSibling.onclick = () => { f.classList.toggle("aperto"); if(f.classList.contains("aperto")) f.querySelector("input").focus(); };
      f.querySelector(".annulla").onclick = () => f.classList.remove("aperto");
      f.querySelector(".ok").onclick = () => {
        const val = {};
        let manca = false;
        f.querySelectorAll("input,select").forEach(i => { val[i.dataset.campo] = i.value.trim(); if(i.required && !i.value.trim()) manca = true; });
        if(manca) return toast("Compila i campi");
        onOk(val);
      };
    }};
}

/* ============ home ============ */
function oggiISO(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

function renderHome(){
  const oggi = oggiISO();
  const prossimi = DB.viaggi.filter(v => v.fine >= oggi);
  const passati  = DB.viaggi.filter(v => v.fine <  oggi);

  const cd = $("#countdown");
  if(prossimi.length){
    const v = prossimi[0];
    const msGiorno = 86400000;
    const diff = Math.round((new Date(v.inizio + "T00:00:00") - new Date(oggi + "T00:00:00")) / msGiorno);
    let grande, picc;
    if(diff > 0){ grande = "Mancano " + diff + " giorni"; picc = v.titolo + " · si parte " + dataIt(v.inizio); }
    else{
      const g = Math.round((new Date(oggi+"T00:00:00") - new Date(v.inizio+"T00:00:00"))/msGiorno) + 1;
      const tot = Math.round((new Date(v.fine+"T00:00:00") - new Date(v.inizio+"T00:00:00"))/msGiorno) + 1;
      grande = "Giorno " + g + " di " + tot; picc = v.titolo + " · in viaggio";
    }
    cd.innerHTML = '<div class="grande">' + esc(grande) + '</div><div class="picc">' + esc(picc) + '</div>';
    cd.style.display = "block";
    cd.onclick = () => apriViaggio(v.id);
  } else cd.style.display = "none";

  const cardHTML = v =>
    '<button class="card-viaggio" data-id="' + esc(v.id) + '">' +
    '<div class="eyebrow">' + esc(v.sottotitolo || "") + '</div>' +
    '<h2>' + esc(v.titolo) + '</h2>' +
    '<div class="date">' + dataIt(v.inizio) + " → " + dataIt(v.fine) + '</div></button>';

  $("#lista-prossimi").innerHTML = prossimi.map(cardHTML).join("") || '<p style="color:var(--muto)">Nessun viaggio in programma.</p>';
  $("#lista-passati").innerHTML = passati.map(cardHTML).join("");
  $("#blocco-passati").style.display = passati.length ? "block" : "none";
  document.querySelectorAll(".card-viaggio").forEach(c => c.onclick = () => apriViaggio(c.dataset.id));
  $("#info-versione").textContent = "Dati del " + (DB.generato || "?");
  aggiornaStatoOffline();
}

let VIAGGIO = null;
let mappaInizializzata = false;

const TABS = [
  ["itinerario","Giorni"], ["mappa","Mappa"], ["documenti","Documenti"],
  ["consigli","Consigli"], ["checklist","Checklist"], ["contatti","Contatti"],
  ["salvati","Salvati"]
];

function apriViaggio(id){
  VIAGGIO = DB.viaggi.find(v => v.id === id);
  if(!VIAGGIO) return;
  $("#titolo-viaggio").textContent = VIAGGIO.titolo;
  $("#tabs").innerHTML = TABS.map(([k,nome],i) =>
    '<button class="tab' + (i===0 ? " attivo" : "") + '" data-tab="' + k + '">' + ICONE[k] +
    '<span class="etic">' + esc(nome) + '</span>' +
    (k === "checklist" ? '<span class="badge" id="badge-check"></span>' : "") + '</button>').join("");
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => apriTab(t.dataset.tab));
  mappaInizializzata = false;
  vistaChecklist = "fare";
  renderItinerario(); renderDocumenti(); renderConsigli(); renderChecklist(); renderContatti(); renderSalvati();
  apriTab("itinerario");
  mostra("#scherm-viaggio");
}
function apriTab(k){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("attivo", t.dataset.tab === k));
  document.querySelectorAll(".pannello").forEach(p => p.classList.remove("attivo"));
  $("#pann-" + k).classList.add("attivo");
  const nome = (TABS.find(t => t[0] === k) || [])[1] || "";
  $("#sezione-corrente").textContent = nome;
  window.scrollTo(0, 0);
  if(k === "mappa") preparaMappa();
}

function renderItinerario(apriData){
  const oggi = oggiISO();
  const note = extra().note;
  $("#pann-itinerario").innerHTML = VIAGGIO.itinerario.map((g,i) => {
    const d = new Date(g.data + "T12:00:00");
    const aperto = (g.data === oggi || g.data === apriData) ? " open" : "";
    const nota = note[g.data];
    return '<details class="giorno' + (g.data === oggi ? " oggi" : "") + '"' + aperto + ' data-giorno="' + g.data + '">' +
      '<summary><div class="dnum"><b>' + d.getDate() + '</b><span>' + MESI[d.getMonth()] + '</span></div>' +
      '<div class="dtit"><b>' + esc(g.titolo) + '</b><small>' + esc(GIORNI[d.getDay()]) + (g.notte ? " · notte: " + esc(g.notte) : "") + '</small></div>' +
      '<span class="freccia">' + ICONE.giu + '</span></summary>' +
      '<div class="corpo"><p>' + esc(g.dettagli) + '</p>' +
      (g.soste && g.soste.length ? '<div class="etichetta">Da non perdere</div><ul>' + g.soste.map(s => "<li>" + esc(s) + "</li>").join("") + '</ul>' : "") +
      (g.notte ? '<div class="notte-chip">' + ICONE.luna + esc(g.notte) + '</div><br>' : "") +
      (nota ? '<div class="nota-giorno"><span class="eyebrow">La mia nota</span>' + esc(nota) + '</div>' : "") +
      '<div class="zona-nota" data-data="' + g.data + '">' +
        '<button class="btn-nota">' + ICONE.piu + (nota ? "Modifica nota" : "Aggiungi nota") + '</button></div>' +
      (g.gmaps ? '<br><a class="bott" style="margin-top:8px" href="' + esc(g.gmaps) + '" target="_blank" rel="noopener">' + ICONE.gmaps + 'Apri in Google Maps</a>' : "") +
      '</div></details>';
  }).join("");

  document.querySelectorAll("#pann-itinerario .zona-nota .btn-nota").forEach(b => b.onclick = () => {
    const zona = b.parentElement;
    const data = zona.dataset.data;
    const testo = extra().note[data] || "";
    zona.innerHTML = '<div class="form-nota"><textarea placeholder="Scrivi qui la tua nota per questo giorno">' + esc(testo) + '</textarea>' +
      '<div class="riga-bott" style="display:flex;gap:8px">' +
      '<button class="annulla" style="flex:1;padding:12px;border-radius:10px;background:var(--sand);border:1px solid var(--bordo)">Annulla</button>' +
      '<button class="ok" style="flex:1;padding:12px;border-radius:10px;background:var(--palm);color:#fff;font-weight:600">Salva</button></div></div>';
    zona.querySelector("textarea").focus();
    zona.querySelector(".annulla").onclick = () => renderItinerario(data);
    zona.querySelector(".ok").onclick = () => {
      const e = extra();
      const nuovo = zona.querySelector("textarea").value.trim();
      if(nuovo) e.note[data] = nuovo; else delete e.note[data];
      salvaExtra(e);
      renderItinerario(data);
      toast(nuovo ? "Nota salvata" : "Nota rimossa");
    };
  });
}

/* ---- mappa ---- */
function tappeVisibili(){ return VIAGGIO.tappe.filter(t => !nascosto("tappe", String(t.n))); }
let mappaLeaflet = null;
function preparaMappa(){
  const online = navigator.onLine;
  $("#avviso-mappa").style.display = online ? "none" : "block";
  $("#mappa-vera").style.display = online ? "block" : "none";
  $("#mappa-svg").style.display = online ? "none" : "block";
  if(!online) disegnaSvg();
  else if(!mappaInizializzata){ mappaInizializzata = true; setTimeout(disegnaLeaflet, 60); }
  disegnaLegenda();
}
function ridisegnaMappe(){
  if(mappaLeaflet){ mappaLeaflet.remove(); mappaLeaflet = null; }
  mappaInizializzata = false;
  const sv = $("#mappa-svg");
  sv.dataset.fatto = ""; sv.innerHTML = "";
  preparaMappa();
}
function disegnaLeaflet(){
  try{
    const mappa = L.map("mappa-vera", {scrollWheelZoom:true, tap:true});
    mappaLeaflet = mappa;
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
      {attribution:'&copy; OpenStreetMap, &copy; CARTO', maxZoom:18}).addTo(mappa);
    const tappe = tappeVisibili();
    const linea = tappe.filter(t => t.tipo === "tappa").map(t => [t.lat, t.lng]);
    L.polyline(linea, {color:"#c05a2b", weight:3, dashArray:"7 7", opacity:.85}).addTo(mappa);
    tappe.forEach(t => {
      const grande = t.tipo === "tappa";
      const icona = L.divIcon({className:"",

        iconSize:[grande?26:18, grande?26:18], iconAnchor:[grande?13:9, grande?13:9]});

function disegnaSvg(){
  const cont = $("#mappa-svg");
  if(cont.dataset.fatto) return;
  cont.dataset.fatto = "1";
  const tappe = tappeVisibili();
  // proiezione equirettangolare dentro il viewBox
  const lats = tappe.map(t => t.lat), lngs = tappe.map(t => t.lng);
  const costaAtl = [[35.77,-5.93],[35.17,-6.15],[34.03,-6.84],[33.60,-7.63],[33.25,-8.50],[32.30,-9.24],[31.51,-9.77],[30.90,-9.83],[30.40,-9.61],[29.70,-9.75],[28.90,-10.5]];
  const costaMed = [[35.77,-5.93],[35.90,-5.40],[35.20,-4.30],[35.25,-3.00],[35.10,-2.20]];
  costaAtl.concat(costaMed).forEach(c => { lats.push(c[0]); lngs.push(c[1]); });
  const mLat = Math.min(...lats)-.4, MLat = Math.max(...lats)+.4;
  const mLng = Math.min(...lngs)-.5, MLng = Math.max(...lngs)+.5;
  const W = 700, H = 620;
  const X = lng => (lng - mLng) / (MLng - mLng) * (W - 60) + 30;
  const Y = lat => (MLat - lat) / (MLat - mLat) * (H - 60) + 30;
  const percorso = pts => pts.map((p,i) => (i ? "L" : "M") + X(p[1]).toFixed(1) + " " + Y(p[0]).toFixed(1)).join(" ");
  const linea = tappe.filter(t => t.tipo === "tappa");
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="' + percorso(costaAtl) + '" fill="none" stroke="#4a52c9" stroke-width="3" stroke-linecap="round" opacity=".5"/>' +
    '<path d="' + percorso(costaMed) + '" fill="none" stroke="#4a52c9" stroke-width="3" stroke-linecap="round" opacity=".5"/>' +
    '<path d="' + percorso(linea.map(t => [t.lat, t.lng])) + '" fill="none" stroke="#c05a2b" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>';
  tappe.forEach(t => {
    const grande = t.tipo === "tappa";
    s += '<circle cx="' + X(t.lng).toFixed(1) + '" cy="' + Y(t.lat).toFixed(1) + '" r="' + (grande?11:7) + '" fill="' + (grande ? "#c05a2b" : "#3e6b4f") + '" stroke="#faf6ec" stroke-width="2"/>' +
      '<text x="' + X(t.lng).toFixed(1) + '" y="' + (Y(t.lat) + (grande?4:3)).toFixed(1) + '" text-anchor="middle" font-size="' + (grande?11:8) + '" font-weight="700" fill="#fff" font-family="-apple-system,sans-serif">' + t.n + '</text>';
  });
  ["Oceano Atlantico"].forEach(() => {
    s += '<text x="' + (X(-10.3)) + '" y="' + Y(32.4) + '" font-size="13" fill="#4a52c9" opacity=".55" font-style="italic" font-family="Georgia,serif" transform="rotate(-72 ' + X(-10.3) + ' ' + Y(32.4) + ')">Oceano Atlantico</text>';
  });
  s += '</svg>';
  cont.innerHTML = s;
}

  document.querySelectorAll("#pann-documenti [data-mio]").forEach(b => b.onclick = () => apriDocumentoMio(b.dataset.mio, miei));

  form.querySelector(".ok").onclick = async () => {

/* rendering PDF con PDF.js: un solo worker riusato, pagine rese solo quando
   entrano in vista (le polizze hanno 36 pagine: renderle tutte subito uccide la RAM) */
let _pdfWorker = null;
async function mostraBlob(blob, corpo, schedaHTML){
  if(blob.type.startsWith("image/")){
    const url = URL.createObjectURL(blob);
    corpo.innerHTML = schedaHTML + '<img src="' + url + '" alt="">';
    return;
  }
  corpo.innerHTML = schedaHTML + '<div class="stato-pdf">Apro il PDF...</div>';
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdf.worker.min.js";
    if(!_pdfWorker) _pdfWorker = new pdfjsLib.PDFWorker();
    const pdf = await pdfjsLib.getDocument({data: await blob.arrayBuffer(), worker: _pdfWorker}).promise;
    corpo._pdf = pdf;
    const larg = corpo.clientWidth || 360;
    const prima = await pdf.getPage(1);
    const vpBase = prima.getViewport({scale: 1});
    const altezzaCss = larg * vpBase.height / vpBase.width;

    corpo.querySelector(".stato-pdf").remove();
    const segnaposti = [];
    for(let n = 1; n <= pdf.numPages; n++){
      const seg = document.createElement("div");
      seg.dataset.pg = n;
      seg.style.cssText = "height:" + altezzaCss + "px;background:#fff;margin-bottom:6px";
      corpo.appendChild(seg);
      segnaposti.push(seg);
    }
    if(pdf.numPages > 1){
      const info = document.createElement("div");
      info.className = "stato-pdf";
      info.textContent = pdf.numPages + " pagine";
      corpo.insertBefore(info, segnaposti[0]);
    }

    // una pagina alla volta, in coda, solo quelle vicine alla parte visibile
    let coda = Promise.resolve();
    const rendi = seg => {
      if(seg.dataset.fatta) return;
      seg.dataset.fatta = "1";
      coda = coda.then(async () => {
        if(corpo._pdf !== pdf) return; // visore chiuso nel frattempo
        const pg = await pdf.getPage(+seg.dataset.pg);
        // risoluzione nativa dello schermo (iPhone = 3x): qualita' piena
        const scala = larg / vpBase.width * Math.min(window.devicePixelRatio || 1, 3);
        const vp = pg.getViewport({scale: scala});
        const c = document.createElement("canvas");
        c.width = vp.width; c.height = vp.height;
        await pg.render({canvasContext: c.getContext("2d"), viewport: vp, intent: "print"}).promise;
        seg.replaceChildren(c);
      }).catch(() => { seg.textContent = "Pagina non renderizzata"; });
    };
    const rendiVisibili = () => {
      const sopra = corpo.scrollTop - 900;
      const sotto = corpo.scrollTop + corpo.clientHeight + 900;
      segnaposti.forEach(seg => {
        const vicina = seg.offsetTop < sotto && seg.offsetTop + seg.offsetHeight > sopra;
        if(!seg.dataset.fatta && vicina) rendi(seg);
        // libera la memoria delle pagine molto lontane (a piena risoluzione pesano)
        if(seg.dataset.fatta === "1" && !vicina && seg.firstChild &&
           Math.abs(seg.offsetTop - corpo.scrollTop) > 4000){
          seg.replaceChildren();
          delete seg.dataset.fatta;
        }
      });
    };
    corpo.onscroll = rendiVisibili;
    rendiVisibili();
  }catch(e){
    corpo.innerHTML = schedaHTML + '<div class="stato-pdf" style="color:#e07a48">Non riesco ad aprire questo PDF. Usa il bottone Condividi in alto per aprirlo altrove.</div>';
  }
}
async function apriDocumento(idx){
  const d = VIAGGIO.documenti[idx];
  const corpo = $("#visore-corpo");
  $("#visore-titolo").textContent = d.titolo;
  corpo.innerHTML = "";
  $("#visore").classList.add("aperto");
  $("#visore-condividi").style.display = d.file ? "flex" : "none";

  // scheda testuale sempre presente in testa
  let schedaHTML = "";
  if(d.scheda || d.codice){
    schedaHTML = '<div style="background:var(--carta);color:var(--ink);padding:16px 18px;font-size:.93rem;line-height:1.55">' +
      (d.codice ? '<div style="font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--terra);font-size:1.05rem;margin-bottom:8px">' + esc(d.codice) + '</div>' : "") +
      esc(d.scheda || "") + '</div>';
  }
  if(!d.file){ corpo.innerHTML = schedaHTML; return; }

  corpo.innerHTML = schedaHTML + '<div class="stato-pdf">Apro il documento...</div>';
  try{
    let blob = cacheDoc.get(d.file);
    if(!blob){
      const chiaro = await decifra(CHIAVE, await scaricaEnc(d.file));
      blob = new Blob([chiaro], {type: d.mime || "application/pdf"});
      cacheDoc.set(d.file, blob);
    }
    corpo.dataset.file = d.file;
    corpo.dataset.nome = d.nomeOriginale || d.titolo;
    await mostraBlob(blob, corpo, schedaHTML);
  }catch(e){
    corpo.innerHTML = schedaHTML + '<div class="stato-pdf" style="color:#e07a48">Documento non disponibile offline: aprilo una volta con la rete, poi resta salvato.</div>';
  }
}

/* ---- consigli ---- */
function renderConsigli(){
  const miei = extra().consigli;
  const visibiliBundle = VIAGGIO.consigli.filter(c => !nascosto("consigli", c.tema));
  const eliminati = (extra().nascosti.consigli || []).length;

  // temi = quelli del viaggio (visibili) + eventuali temi nuovi creati da Paolo
  const temi = visibiliBundle.map(c => c.tema);
  miei.forEach(m => { if(!temi.includes(m.tema)) temi.push(m.tema); });

  const NUOVO = "Nuovo tema...";
  let html =
    '<button class="btn-aggiungi">' + ICONE.piu + 'Aggiungi un consiglio mio</button>' +
    '<div class="form-inline" id="form-consiglio">' +
      '<select data-campo="tema">' + temi.map(t => '<option>' + esc(t) + '</option>').join("") + '<option>' + NUOVO + '</option></select>' +
      '<input type="text" placeholder="Nome del nuovo tema (solo se scegli Nuovo tema)" data-campo="nuovoTema" style="display:none">' +
      '<input type="text" placeholder="Il consiglio" data-campo="testo">' +
      '<div class="riga-bott"><button class="annulla">Annulla</button><button class="ok">Salva</button></div>' +
    '</div>';

  html += temi.map(tema => {
    const bundle = visibiliBundle.find(c => c.tema === tema);
    const mieiQui = miei.filter(m => m.tema === tema);
    const temaBundle = !!bundle;
    return '<details class="tema"><summary>' + esc(tema) + (temaBundle ? "" : '<span class="mio-tag">mio</span>') +
      '<span class="freccia" style="margin-left:auto;color:var(--muto)">' + ICONE.giu + '</span>' +
      (temaBundle ? '<button class="btn-elimina" data-del-tema="' + esc(tema) + '" aria-label="Elimina">' + ICONE.cestino + '</button>' : "") +
      '</summary><ul>' +
      (bundle ? bundle.punti.map(p => "<li>" + esc(p) + "</li>").join("") : "") +
      mieiQui.map(m => '<li>' + esc(m.testo) + '<span class="mio-tag">mio</span> ' +
        '<button class="btn-elimina" style="display:inline;padding:2px 6px;vertical-align:middle" data-del-mio="' + esc(m.id) + '" aria-label="Elimina">' + ICONE.cestino + '</button></li>').join("") +
      '</ul></details>';
  }).join("") + rigaRipristino("consigli", eliminati);

  $("#pann-consigli").innerHTML = html;

  const form = $("#form-consiglio");
  form.previousElementSibling.onclick = () => form.classList.toggle("aperto");
  const sel = form.querySelector('[data-campo="tema"]');
  const campoNuovo = form.querySelector('[data-campo="nuovoTema"]');
  sel.onchange = () => campoNuovo.style.display = sel.value === NUOVO ? "block" : "none";
  form.querySelector(".annulla").onclick = () => form.classList.remove("aperto");
  form.querySelector(".ok").onclick = () => {
    const testo = form.querySelector('[data-campo="testo"]').value.trim();
    if(!testo) return toast("Scrivi il consiglio");
    let tema = sel.value;
    if(tema === NUOVO){
      tema = campoNuovo.value.trim();
      if(!tema) return toast("Dai un nome al nuovo tema");
    }
    const e = extra();
    e.consigli.push({id: nuovoId(), tema, testo});
    salvaExtra(e);
    renderConsigli();
    toast("Consiglio aggiunto");
  };

  document.querySelectorAll("#pann-consigli [data-del-tema]").forEach(b => b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    if(!confirm('Eliminare il tema "' + b.dataset.delTema + '"?')) return;
    nascondi("consigli", b.dataset.delTema);
    renderConsigli();
  });
  document.querySelectorAll("#pann-consigli [data-del-mio]").forEach(b => b.onclick = ev => {
    ev.preventDefault(); ev.stopPropagation();
    if(!confirm("Eliminare questo consiglio?")) return;
    const e = extra();
    e.consigli = e.consigli.filter(x => x.id !== b.dataset.delMio);
    salvaExtra(e);
    renderConsigli();
  });
  attivaRipristino("#pann-consigli", renderConsigli);
}

/* ---- checklist ---- */
function chiaveCheck(){ return "trippone-check-" + VIAGGIO.id; }
let vistaChecklist = "fare";

function vociChecklist(vista){
  const ex = extra();
  const sezione = vista === "fare" ? "checklist" : "valigia";
  const bundle = (vista === "fare" ? VIAGGIO.checklist : (VIAGGIO.valigia || []))
    .filter(c => !nascosto(sezione, c.id));

}

function renderChecklist(){
  const stato = JSON.parse(localStorage.getItem(chiaveCheck()) || "{}");
  const oggi = oggiISO();
  const vista = vistaChecklist;
  const voci = vociChecklist(vista).slice().sort((a,b) => {
    const fa = stato[a.id] ? 1 : 0, fb = stato[b.id] ? 1 : 0;
    if(fa !== fb) return fa - fb;
    return (a.entro || "9999").localeCompare(b.entro || "9999");
  });
  const fatte = voci.filter(c => stato[c.id]).length;
  const scadute = voci.filter(c => !stato[c.id] && c.entro && c.entro < oggi).length;

  const fv = formInline(
    vista === "fare"
      ? [{tipo:"text", nome:"testo", ph:"Cosa c'e' da fare?"}, {tipo:"date", nome:"entro", ph:"Entro quando (facoltativo)", opz:true}]
      : [{tipo:"text", nome:"testo", ph:"Cosa mettere in valigia?"}],
    val => {
      const e = extra();
      const voce = {id: nuovoId(), testo: val.testo};
      if(val.entro) voce.entro = val.entro;
      e[vista === "fare" ? "checklist" : "valigia"].push(voce);
      salvaExtra(e);
      renderChecklist();
    });

  $("#pann-checklist").innerHTML =
    '<div class="segmenti">' +
      '<button data-vista="fare"' + (vista === "fare" ? ' class="attivo"' : "") + '>Da fare</button>' +
      '<button data-vista="valigia"' + (vista === "valigia" ? ' class="attivo"' : "") + '>Valigia</button></div>' +
    '<div class="progresso"><b>' + fatte + " su " + voci.length + "</b> " + (vista === "fare" ? "fatte" : "in valigia") +
      (scadute ? ' · <span style="color:var(--terra);font-weight:700">' + scadute + (scadute === 1 ? " scaduta" : " scadute") + '</span>' : "") +
      '<div class="barra-prog"><i style="width:' + (voci.length ? Math.round(fatte / voci.length * 100) : 0) + '%"></i></div></div>' +
    '<button class="btn-aggiungi">' + ICONE.piu + (vista === "fare" ? "Aggiungi una cosa da fare" : "Aggiungi alla valigia") + '</button>' +
    fv.html +
    voci.map(c => {
      const fatta = !!stato[c.id];
      const inRitardo = !fatta && c.entro && c.entro < oggi;
      return '<div class="check' + (fatta ? " fatta" : "") + (inRitardo ? " ritardo" : "") + '">' +
        '<input type="checkbox" id="ck-' + esc(c.id) + '" ' + (fatta ? "checked" : "") + '>' +
        '<label for="ck-' + esc(c.id) + '">' + esc(c.testo) + (c.mio ? '<span class="mio-tag">mia</span>' : "") +
        (c.entro ? '<span class="entro">' + (inRitardo ? "SCADUTA il " : "entro ") + dataIt(c.entro) + '</span>' : "") +
        '</label>' +
        '<button class="btn-elimina" data-del-voce="' + esc(c.id) + '" data-tipo="' + (c.mio ? "mia" : "bundle") + '" aria-label="Elimina">' + ICONE.cestino + '</button>' +
        '</div>';
    }).join("") +
    rigaRipristino(vista === "fare" ? "checklist" : "valigia", (extra().nascosti[vista === "fare" ? "checklist" : "valigia"] || []).length);

  document.querySelectorAll("#pann-checklist .segmenti button").forEach(b =>
    b.onclick = () => { vistaChecklist = b.dataset.vista; renderChecklist(); });
  fv.attiva();
  voci.forEach(c => {
    $("#ck-" + CSS.escape(c.id)).onchange = e => {
      const s = JSON.parse(localStorage.getItem(chiaveCheck()) || "{}");
      if(e.target.checked) s[c.id] = true; else delete s[c.id];
      localStorage.setItem(chiaveCheck(), JSON.stringify(s));
      renderChecklist();
    };
  });
  document.querySelectorAll("#pann-checklist [data-del-voce]").forEach(b => b.onclick = () => {
    if(!confirm("Eliminare questa voce?")) return;
    const lista = vista === "fare" ? "checklist" : "valigia";
    if(b.dataset.tipo === "mia"){
      const e = extra();
      e[lista] = e[lista].filter(x => x.id !== b.dataset.delVoce);
      salvaExtra(e);
    } else nascondi(lista, b.dataset.delVoce);
    renderChecklist();
  });
  attivaRipristino("#pann-checklist", renderChecklist);

  // il pallino conta solo le cose da fare (non la valigia)
  const daFare = vociChecklist("fare");
  const restanti = daFare.filter(c => !stato[c.id]).length;
  const badge = $("#badge-check");
  if(badge){ badge.textContent = restanti || ""; badge.style.display = restanti ? "flex" : "none"; }
}

/* ---- contatti ---- */
function renderContatti(){
  const miei = extra().contatti;
  const fc = formInline(
    [{tipo:"text", nome:"nome", ph:"Nome"}, {tipo:"tel", nome:"tel", ph:"Numero (con prefisso, es. +212...)"}, {tipo:"text", nome:"note", ph:"Nota (facoltativa)", opz:true}],
    val => {
      const e = extra();
      e.contatti.push({id: nuovoId(), nome: val.nome, tel: val.tel, note: val.note});
      salvaExtra(e);
      renderContatti();
    });
  const rigaContatto = (c, mio) =>
    '<div class="contatto"><div class="info"><b>' + esc(c.nome) + (mio ? '<span class="mio-tag">mio</span>' : "") + '</b>' +
    '<small>' + esc(c.tel) + (c.note ? " · " + esc(c.note) : "") + '</small></div>' +
    '<button class="btn-elimina" data-del-cont="' + esc(c.id) + '" data-tipo="' + (mio ? "mio" : "bundle") + '" aria-label="Elimina">' + ICONE.cestino + '</button>' +
    '<a class="chiama" href="tel:' + esc(c.tel) + '" aria-label="Chiama">' + ICONE.tel + '</a></div>';

  const eliminati = (extra().nascosti.contatti || []).length;
  $("#pann-contatti").innerHTML =
    '<button class="btn-aggiungi">' + ICONE.piu + 'Aggiungi contatto</button>' + fc.html +
    miei.map(c => rigaContatto(c, true)).join("") +
    VIAGGIO.contatti.filter(c => !nascosto("contatti", c.id)).map(c => rigaContatto(c, false)).join("") +
    rigaRipristino("contatti", eliminati);
  fc.attiva();
  document.querySelectorAll("#pann-contatti [data-del-cont]").forEach(b => b.onclick = () => {
    if(!confirm("Eliminare questo contatto?")) return;
    if(b.dataset.tipo === "mio"){
      const e = extra();
      e.contatti = e.contatti.filter(x => x.id !== b.dataset.delCont);
      salvaExtra(e);
    } else nascondi("contatti", b.dataset.delCont);
    renderContatti();
  });
  attivaRipristino("#pann-contatti", renderContatti);
}

/* ---- salvati (link da TikTok / Instagram / web) ---- */
function piattaformaDi(url){
  if(/tiktok\./i.test(url)) return ["TikTok", "#010101"];
  if(/instagram\./i.test(url)) return ["IG", "#c13584"];
  if(/youtu/i.test(url)) return ["YT", "#cc0000"];
  if(/maps\./i.test(url)) return ["Maps", "#3e6b4f"];
  return ["Link", "#4a52c9"];
}
function renderSalvati(){
  const salvati = extra().salvati;
  const fs = formInline(
    [{tipo:"url", nome:"url", ph:"Incolla qui il link"}, {tipo:"text", nome:"titolo", ph:"Titolo (es. Riad visto su TikTok)", opz:true}],
    val => {
      if(!/^https?:\/\//i.test(val.url)) return toast("Il link deve iniziare con http");
      const e = extra();
      e.salvati.unshift({id: nuovoId(), url: val.url, titolo: val.titolo});
      salvaExtra(e);
      renderSalvati();
      toast("Salvato");
    });
  $("#pann-salvati").innerHTML =
    '<p class="nota-sezione">Video e posti trovati sui social: nell\'app che li mostra tocca Condividi, Copia link, poi incollalo qui. Si riaprono con un tocco nell\'app giusta (serve la rete).</p>' +
    '<button class="btn-aggiungi">' + ICONE.piu + 'Aggiungi link</button>' + fs.html +
    (salvati.length ? salvati.map(s => {
      const [nome, colore] = piattaformaDi(s.url);
      let dominio = ""; try{ dominio = new URL(s.url).hostname.replace("www.",""); }catch(e){}
      return '<div class="salvato"><span class="piattaforma" style="background:' + colore + '">' + nome + '</span>' +
        '<span class="info"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.titolo || dominio || s.url) + '</a>' +
        '<small>' + esc(dominio) + '</small></span>' +
        '<button class="btn-elimina" data-del-salv="' + esc(s.id) + '" aria-label="Elimina">' + ICONE.cestino + '</button></div>';
    }).join("") : '<p style="color:var(--muto);text-align:center;padding:20px 0">Ancora niente: incolla il primo link.</p>');
  fs.attiva();
  document.querySelectorAll("#pann-salvati [data-del-salv]").forEach(b => b.onclick = () => {
    if(!confirm("Eliminare questo link?")) return;
    const e = extra();
    e.salvati = e.salvati.filter(x => x.id !== b.dataset.delSalv);
    salvaExtra(e);
    renderSalvati();
  });
}

/* ============ offline warm-up ============ */
async function preparaOffline(interattivo){
  if(!navigator.onLine){ if(interattivo) toast("Sei offline: riprova con la rete"); return; }
  const file = DB.viaggi.flatMap(v => (v.documenti || []).filter(d => d.file).map(d => d.file));
  let ok = 0;
  for(const f of file){
    try{ const r = await fetch(f); if(r.ok) ok++; }catch(e){}
  }
  localStorage.setItem("trippone-offline-pronto", ok === file.length ? DB.generato || "si" : "");
  aggiornaStatoOffline();
  if(interattivo) toast(ok === file.length ? "Tutto pronto per l'offline" : "Scaricati " + ok + " su " + file.length);
}
function aggiornaStatoOffline(){
  const pronto = localStorage.getItem("trippone-offline-pronto");
  $("#stato-offline").textContent = pronto ? "offline pronto" : "offline da preparare";
}

/* ============ avvio ============ */
$("#btn-sblocca").onclick = async () => {
  const pw = $("#password").value;
  if(!pw) return;
  $("#err-sblocco").textContent = "";
  $("#stato-sblocco").textContent = "Verifico...";
  try{
    DB = await provaSblocco(pw);
    $("#stato-sblocco").textContent = "";
    renderHome(); mostra("#scherm-home");
    preparaOffline(false);
  }catch(e){
    $("#stato-sblocco").textContent = "";
    $("#err-sblocco").textContent = navigator.onLine ? "Password sbagliata" : "Serve la rete per il primo accesso";
  }
};
$("#password").addEventListener("keydown", e => { if(e.key === "Enter") $("#btn-sblocca").click(); });
$("#btn-home").onclick = () => { renderHome(); mostra("#scherm-home"); };
$("#btn-esci").onclick = () => {
  localStorage.removeItem("trippone-chiave");
  localStorage.removeItem("trippone-salt");
  location.reload();
};
$("#btn-scarica-offline").onclick = () => preparaOffline(true);
window.addEventListener("online", () => { if(DB) preparaOffline(false); });

(async function init(){
  DB = await sbloccoAutomatico();
  if(DB){ renderHome(); mostra("#scherm-home"); preparaOffline(false); }
  else mostra("#scherm-sblocco");
})();

/* ============ service worker ============ */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    let ricaricato = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if(ricaricato) return; ricaricato = true; location.reload();
    });
  });
}
</script>
